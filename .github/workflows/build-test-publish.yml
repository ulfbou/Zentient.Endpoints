# Build, Test & Publish Workflow for Zentient.Endpoints
# Path: .github/workflows/build-test-publish.yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop/*
      - release/*
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop/*
      - release/*
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head_sha: ${{ github.sha }}
      head_branch: ${{ github.ref_name }}
      sem_ver: ${{ steps.gitversion.outputs.SemVer }}
      nuget_version_v2: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
      major_minor_patch: ${{ steps.gitversion.outputs.MajorMinorPatch }}
      gitversion_major: ${{ steps.gitversion.outputs.Major }}
      gitversion_minor: ${{ steps.gitversion.outputs.Minor }}
      gitversion_patch: ${{ steps.gitversion.outputs.Patch }}
      component_to_release: ${{ steps.determine_component.outputs.component_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Determine Component to Release
        id: determine_component
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          COMPONENT_NAME=""

          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == develop/* ]]; then
            COMPONENT_NAME="Endpoints"
            echo "Defaulting component to Endpoints for branch: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" == "release/Endpoints" ]]; then
            COMPONENT_NAME="Endpoints"
            echo "Detected release branch for main component: $COMPONENT_NAME"
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            COMPONENT_NAME=$(echo "$BRANCH_NAME" | sed 's/^release\///')
            echo "Detected release branch for component: $COMPONENT_NAME"
          else
            COMPONENT_NAME="Endpoints"
            echo "Defaulting component to Endpoints for branch: $BRANCH_NAME"
          fi
          echo "component_name=$COMPONENT_NAME" >> $GITHUB_OUTPUT
          echo "Determined component for packing: $COMPONENT_NAME"

      - name: Restore NuGet Packages
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build Solution
        run: |
          dotnet build Zentient.Endpoints.sln \
            --configuration Release \
            --no-restore \
            /p:ZENTIENT_VERSION_FINAL=${{ steps.gitversion.outputs.SemVer }} \
            /p:ZENTIENT_VERSION_MAJOR=${{ steps.gitversion.outputs.Major }} \
            /p:ZENTIENT_VERSION_MINOR=${{ steps.gitversion.outputs.Minor }} \
            /p:ZENTIENT_VERSION_PATCH=${{ steps.gitversion.outputs.Patch }}

      - name: Run Tests
        run: dotnet test Zentient.Endpoints.sln --configuration Release --no-build --logger trx

      - name: Pack NuGet Packages
        env:
          GITVERSION_NUGGET_VERSION_V2: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
          COMPONENT_TO_PACK: ${{ steps.determine_component.outputs.component_name }}
        run: |
          mkdir -p artifacts/packages
          echo "DEBUG: Attempting to pack with version (from GITVERSION_NUGGET_VERSION_V2 env var): $GITVERSION_NUGGET_VERSION_V2"
          echo "DEBUG: Component to pack: $COMPONENT_TO_PACK"

          PACKAGE_VERSION="$GITVERSION_NUGGET_VERSION_V2"
          PROJECT_PATH=""

          if [[ "$COMPONENT_TO_PACK" == "Endpoints" ]]; then
            PROJECT_PATH="src/Zentient.Endpoints/Zentient.Endpoints.csproj"
            echo "Packing main Zentient.Endpoints project: $PROJECT_PATH"
          elif [[ -n "$COMPONENT_TO_PACK" ]]; then
            PROJECT_PATH="src/Zentient.Endpoints.$COMPONENT_TO_PACK/Zentient.Endpoints.$COMPONENT_TO_PACK.csproj"
            echo "Packing component-specific project: $PROJECT_PATH"
          else
            echo "ERROR: No valid component determined for packing. Exiting."
            exit 1
          fi

          if [[ ! -f "$PROJECT_PATH" ]]; then
            echo "ERROR: Project file not found at $PROJECT_PATH. Cannot pack."
            exit 1
          fi

          dotnet pack "$PROJECT_PATH" --configuration Release --output artifacts/packages /p:Version=\"$PACKAGE_VERSION\" --no-build

      - name: Verify Packed NuGet Package Version
        env:
          COMPONENT_TO_CHECK: ${{ steps.determine_component.outputs.component_name }}
        run: |
          echo "Contents of artifacts/packages AFTER dotnet pack:"
          ls -lR artifacts/packages
           
          if [[ "$COMPONENT_TO_CHECK" == "Endpoints" ]]; then
            PACKAGE_BASE_NAME="Zentient.Endpoints"
          else
            PACKAGE_BASE_NAME="Zentient.Endpoints.${COMPONENT_TO_CHECK}"
          fi
           
          EXPECTED_NUPKG_NAME="${PACKAGE_BASE_NAME}.${{ steps.gitversion.outputs.NuGetVersionV2 }}.nupkg"
          EXPECTED_NUPKG_PATH="artifacts/packages/$EXPECTED_NUPKG_NAME"
          
          echo "DEBUG: Looking for expected package: $EXPECTED_NUPKG_PATH"

          if [ -f "$EXPECTED_NUPKG_PATH" ]; then
            echo "SUCCESS: Expected package '$EXPECTED_NUPKG_PATH' found."
          else
            echo "ERROR: Expected package '$EXPECTED_NUPKG_PATH' NOT found."
            echo "Failing job because the specific NuGet package for component '$COMPONENT_TO_CHECK' was not created with the correct version."
            exit 1
          fi

      - name: Publish .NET 8.0 Application Output
        if: ${{ steps.determine_component.outputs.component_name == 'Endpoints' }}
        run: |
          mkdir -p artifacts/app/net8.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net8.0 \
            --framework net8.0 \
            /p:UseAppHost=false \
            /p:ZENTIENT_VERSION_FINAL=${{ steps.gitversion.outputs.SemVer }} \
            --no-build

      - name: Publish .NET 9.0 Application Output
        if: ${{ steps.determine_component.outputs.component_name == 'Endpoints' }}
        run: |
          mkdir -p artifacts/app/net9.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net9.0 \
            --framework net9.0 \
            /p:UseAppHost=false \
            /p:ZENTIENT_VERSION_FINAL=${{ steps.gitversion.outputs.SemVer }} \
            --no-build

      - name: Upload NuGet Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages

      - name: Upload .NET 8.0 App Artifact
        if: ${{ steps.determine_component.outputs.component_name == 'Endpoints' }}
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net8.0-${{ github.sha }}
          path: artifacts/app/net8.0

      - name: Upload .NET 9.0 App Artifact
        if: ${{ steps.determine_component.outputs.component_name == 'Endpoints' }}
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net9.0-${{ github.sha }}
          path: artifacts/app/net9.0

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    if: |
      success() && (
        startsWith(github.ref, 'refs/heads/release/') ||
        github.ref_type == 'tag'
      )

    steps:
      - name: Checkout Repository (for release notes and Dockerfiles)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET SDK (for dotnet nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install GitVersion (for final version consistency)
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version (for final version consistency)
        id: gitversion_release
        uses: GitTools/actions/gitversion/execute@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set REPO_OWNER_LOWER env var
        id: set_repo_owner_lower
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.build-and-test.outputs.head_sha }}
          path: artifacts/packages

      - name: Debug NuGet Package Info (for NuGet.org push)
        run: |
          echo "Debug Info for NuGet Push:"
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_type: ${{ github.ref_type }}"
          echo "GitVersion nuget_version_v2: ${{ needs.build-and-test.outputs.nuget_version_v2 }}"
          echo "Component to release: ${{ needs.build-and-test.outputs.component_to_release }}"
          echo "Contents of artifacts/packages:"
          ls -R artifacts/packages || true
          echo "Attempting to find package using direct path and wildcard:"
          find artifacts/packages -name "*.${{ needs.build-and-test.outputs.nuget_version_v2 }}.nupkg" -print || true
          find artifacts/packages -name "*.nupkg" -print || true

      - name: Push Specific NuGet Packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          COMPONENT_TO_PUSH: ${{ needs.build-and-test.outputs.component_to_release }}
          PACKAGE_VERSION: ${{ needs.build-and-test.outputs.nuget_version_v2 }}
        run: |
          PACKAGE_BASE_NAME="Zentient.Endpoints"
          if [[ "$COMPONENT_TO_PUSH" != "Endpoints" ]]; then
            PACKAGE_BASE_NAME="${PACKAGE_BASE_NAME}.${COMPONENT_TO_PUSH}"
          fi
          
          PRIMARY_PACKAGE_GLOB="artifacts/packages/${PACKAGE_BASE_NAME}.${PACKAGE_VERSION}.nupkg"
          SYMBOL_PACKAGE_GLOB="artifacts/packages/${PACKAGE_BASE_NAME}.${PACKAGE_VERSION}.snupkg"

          if find "$PRIMARY_PACKAGE_GLOB" -print -quit | grep -q .; then
            echo "Publishing primary package: $PRIMARY_PACKAGE_GLOB..."
            dotnet nuget push "$PRIMARY_PACKAGE_GLOB" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          else
            echo "Primary NuGet package not found for component '$COMPONENT_TO_PUSH'. Expected: $PRIMARY_PACKAGE_GLOB. Skipping push."
            exit 1
          fi

          if find "$SYMBOL_PACKAGE_GLOB" -print -quit | grep -q .; then
            echo "Publishing symbols package: $SYMBOL_PACKAGE_GLOB..."
            dotnet nuget push "$SYMBOL_PACKAGE_GLOB" \
              --source https://api.nuget.org/v3/index.json/symbolpackage \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          else
            echo "Symbols NuGet package not found for component '$COMPONENT_TO_PUSH'. Expected: $SYMBOL_PACKAGE_GLOB. Skipping push."
          fi

      - name: Download .NET 8.0 App Artifact (for Docker build)
        if: ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' }}
        uses: actions/download-artifact@v4
        with:
          name: zentient-endpoints-net8.0-${{ needs.build-and-test.outputs.head_sha }}
          path: /tmp/app_net80

      - name: Build & Push Docker Image (net8.0)
        if: ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' }}
        uses: docker/build-push-action@v5
        with:
          context: /tmp/app_net80
          file: Dockerfile.runtime
          push: true
          build-args: TARGET_FRAMEWORK=8.0
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/zentient-endpoints:net8.0-${{ needs.build-and-test.outputs.sem_ver }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/zentient-endpoints:net8.0-latest', env.REPO_OWNER_LOWER) || '' }}
        env:
          DOCKER_BUILDKIT: 1

      - name: Download .NET 9.0 App Artifact (for Docker build)
        if: ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' }}
        uses: actions/download-artifact@v4
        with:
          name: zentient-endpoints-net9.0-${{ needs.build-and-test.outputs.head_sha }}
          path: /tmp/app_net90

      - name: Build & Push Docker Image (net9.0)
        if: ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' }}
        uses: docker/build-push-action@v5
        with:
          context: /tmp/app_net90
          file: Dockerfile.runtime
          push: true
          build-args: TARGET_FRAMEWORK=9.0
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/zentient-endpoints:net9.0-${{ needs.build-and-test.outputs.sem_ver }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/zentient-endpoints:net9.0-latest', env.REPO_OWNER_LOWER) || '' }}
        env:
          DOCKER_BUILDKIT: 1

      - name: Zip .NET 8.0 App Artifact for Release
        if: ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' }}
        run: |
          cd /tmp/app_net80
          zip -r ${{ github.workspace }}/artifacts/Zentient.Endpoints.net8.0.zip .
          echo "Zipped .NET 8.0 app to ${{ github.workspace }}/artifacts/Zentient.Endpoints.net8.0.zip"

      - name: Zip .NET 9.0 App Artifact for Release
        if: ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' }}
        run: |
          cd /tmp/app_net90
          zip -r ${{ github.workspace }}/artifacts/Zentient.Endpoints.net9.0.zip .
          echo "Zipped .NET 9.0 app to ${{ github.workspace }}/artifacts/Zentient.Endpoints.net9.0.zip"

      - name: Extract Release Notes
        id: extract_release_notes
        run: |
          awk "/^## \\[${{ needs.build-and-test.outputs.major_minor_patch }}\\]/,/^## /" src/Zentient.Endpoints/CHANGELOG.md > release-notes.md
          echo "body_path=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build-and-test.outputs.sem_ver }}
          name: Release ${{ needs.build-and-test.outputs.sem_ver }}
          draft: false 
          prerelease: ${{ needs.build-and-test.outputs.sem_ver != needs.build-and-test.outputs.major_minor_patch }}
          body_path: release-notes.md 
          
          files: |
            ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' && format('artifacts/packages/Zentient.Endpoints.{0}.nupkg', needs.build-and-test.outputs.nuget_version_v2) || format('artifacts/packages/Zentient.Endpoints.{0}.{1}.nupkg', needs.build-and-test.outputs.component_to_release, needs.build-and-test.outputs.nuget_version_v2) }}
            ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' && format('artifacts/packages/Zentient.Endpoints.{0}.snupkg', needs.build-and-test.outputs.nuget_version_v2) || format('artifacts/packages/Zentient.Endpoints.{0}.{1}.snupkg', needs.build-and-test.outputs.component_to_release, needs.build-and-test.outputs.nuget_version_v2) }}
            
            ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' && 'artifacts/Zentient.Endpoints.net8.0.zip' || '' }}
            ${{ needs.build-and-test.outputs.component_to_release == 'Endpoints' && 'artifacts/Zentient.Endpoints.net9.0.zip' || '' }}
