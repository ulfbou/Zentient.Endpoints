name: CI/CD - Build, Test & Publish (Zentient.Endpoints)

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head_sha: ${{ github.sha }}
      head_branch: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Restore
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build
        run: dotnet build Zentient.Endpoints.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Zentient.Endpoints.sln --configuration Release --no-build --logger trx

      - name: Pack
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/**/*.csproj \
            --configuration Release \
            --output artifacts/packages \
            /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages

  detect-changes:
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      modified_projects: ${{ steps.get_modified.outputs.modified_projects_for_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-test.outputs.head_sha }}
          fetch-depth: 0

      - name: Get Modified Packable Projects
        id: get_modified
        run: |
          BRANCH="${{ needs.build-and-test.outputs.head_branch }}"
          BASE_REF="origin/main"
          git fetch origin main

          MODIFIED_PACKABLE_PROJECTS=""

          if [[ "$BRANCH" == release/v* ]]; then
            echo "Stable release: checking diff against main"
            ALL_PROJECTS=$(find src/ -name "*.csproj" ! -path "src/Zentient.Endpoints.Tests.Shared/*" -exec grep -l '<IsPackable>true</IsPackable>' {} + || true)
            for PROJECT in $ALL_PROJECTS; do
              if git diff --name-only "$BASE_REF" HEAD -- "$PROJECT" "${PROJECT%/*}/" | grep -q .; then
                MODIFIED_PACKABLE_PROJECTS+="${PROJECT}"$'\n'
              fi
            done
          elif [[ "$BRANCH" == release/* ]]; then
            PACKAGE=$(echo "$BRANCH" | sed 's|release/||')
            if [[ "$PACKAGE" == "Endpoints" ]]; then
              TARGET="src/Zentient.Endpoints/Zentient.Endpoints.csproj"
            else
              TARGET="src/Zentient.Endpoints.${PACKAGE}/Zentient.Endpoints.${PACKAGE}.csproj"
            fi
            if git diff --name-only "$BASE_REF" HEAD -- "$TARGET" "${TARGET%/*}/" | grep -q .; then
              MODIFIED_PACKABLE_PROJECTS="${TARGET}"
            fi
          else
            echo "Unexpected release branch format: $BRANCH"
            exit 1
          fi

          echo "modified_projects_for_release<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MODIFIED_PACKABLE_PROJECTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  publish-packages:
    runs-on: ubuntu-latest
    needs: [build-and-test, detect-changes]
    if: |
      startsWith(needs.build-and-test.outputs.head_branch, 'release/') &&
      needs.detect-changes.outputs.modified_projects != ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-test.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.build-and-test.outputs.head_sha }}
          path: artifacts/packages

      - name: Push Modified NuGet Packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          echo "${{ needs.detect-changes.outputs.modified_projects }}" | while read -r PROJECT_PATH; do
            PACKAGE_NAME=$(basename "$PROJECT_PATH" .csproj)
            PACKAGE_FILE=$(find artifacts/packages -name "${PACKAGE_NAME}.*.nupkg" ! -name "*.symbols.nupkg" | head -n1)
            if [[ -f "$PACKAGE_FILE" ]]; then
              echo "Publishing $PACKAGE_FILE..."
              dotnet nuget push "$PACKAGE_FILE" \
                --source https://api.nuget.org/v3/index.json \
                --api-key "$NUGET_API_KEY" \
                --skip-duplicate
            else
              echo "No package found for $PACKAGE_NAME - skipping."
            fi
          done

      - name: Summarize Published Packages
        run: |
          echo "### Published NuGet Packages" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.detect-changes.outputs.modified_projects }}" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  publish:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: |
      always() &&
      (startsWith(github.ref, 'refs/heads/release/') || github.ref_type == 'tag') &&
      needs.build_and_test.outputs.commit_sha == github.sha

    steps:
      - name: Download NuGet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: ./artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Read version from GitVersion
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Push NuGet & Symbols for Zentient.Endpoints
        run: |
          for file in artifacts/packages/Zentient.Endpoints.*.{nupkg,snupkg}; do
            dotnet nuget push "$file" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate;
          done
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          (github.ref_type == 'tag' && gitversion.outputs.preReleaseTag == '')

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          github.ref_type == 'tag'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner | toLower }}/zentient-endpoints:${{ steps.gitversion.outputs.semVer }}
            ${{ github.ref_type == 'tag' && 'ghcr.io/' + (github.repository_owner | toLower) + '/zentient-endpoints:latest' || '' }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "$GitVersion: semVer ${{ steps.gitversion.outputs.semVer }}"
          draft: false
          prerelease: false
          body: |
            $(awk '/## \[${{ steps.gitversion.outputs.majorMinorPatch }}\]/,/^## / {{print}}' src/Zentient.Endpoints/CHANGELOG.md)

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            artifacts/packages/Zentient.Endpoints.*.nupkg
            artifacts/packages/Zentient.Endpoints.*.snupkg
          asset_name: |
            ${{ steps.gitversion.outputs.majorMinorPatch }}.nupkg
            ${{ steps.gitversion.outputs.majorMinorPatch }}.snupkg
          asset_content_type: application/octet-stream
