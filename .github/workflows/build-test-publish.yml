# Build, Test & Publish Workflow for Zentient.Endpoints
# Path: .github/workflows/build-test-publish.yml
name: CI/CD - Build, Test & Publish (Zentient.Endpoints)

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
      - 'release/**'
  pull_request:
    branches:
      - main

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test: # Renamed for consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessary for pushing Docker images to GitHub Packages (GHCR)

    outputs:
      head_sha: ${{ github.sha }}
      head_branch: ${{ github.ref_name }}
      sem_ver: ${{ steps.gitversion.outputs.semVer }}
      nuget_version_v2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      # Export other GitVersion outputs if needed by downstream jobs, e.g., majorMinorPatch

    concurrency:
      group: ${{ github.ref }}-build
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion # This ID is unique within this job scope
        uses: GitTools/actions/gitversion/execute@v1

      - name: Restore dependencies
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build solution
        run: dotnet build Zentient.Endpoints.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Zentient.Endpoints.sln --configuration Release --no-build --logger trx

      - name: Pack NuGet Packages
        run: |
          mkdir -p artifacts/packages
          # Pack only Zentient.Endpoints.csproj for now. Adjust `find` for more projects if needed.
          find src -name "Zentient.Endpoints.csproj" -print0 | xargs -0 -I {} dotnet pack "{}" \
            --configuration Release \
            --output artifacts/packages \
            /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }} \
            --no-build

      - name: Publish for .NET 8.0 Deployment
        run: |
          mkdir -p artifacts/app/net8.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net8.0 \
            --framework net8.0 \
            /p:UseAppHost=false \
            --no-build

      - name: Publish for .NET 9.0 Deployment
        run: |
          mkdir -p artifacts/app/net9.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net9.0 \
            --framework net9.0 \
            /p:UseAppHost=false \
            --no-build

      - name: Upload NuGet Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages

      - name: Upload .NET 8.0 App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net8.0-${{ github.sha }}
          path: artifacts/app/net8.0

      - name: Upload .NET 9.0 App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net9.0-${{ github.sha }}
          path: artifacts/app/net9.0

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always() # Always upload test results, even if tests fail
        with:
          name: test-results-${{ github.sha }}
          path: test-results # Assuming test-results directory is generated at root

  publish:
    needs: build-and-test # Corrected job name
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating releases and uploading assets
      packages: write # Needed for pushing Docker images to GHCR and potentially NuGet
      actions: read # Needed for workflow_run context and other actions

    if: |
      success() &&
      (startsWith(github.ref, 'refs/heads/release/') || github.ref_type == 'tag')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # Checkout current commit for release notes
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x # Only 9.0.x needed for push operations

      - name: Install GitVersion CLI (for preReleaseTag check)
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version (for publish job)
        id: gitversion_publish # Unique ID for this step
        uses: GitTools/actions/gitversion/execute@v1
        with:
          # Use outputs from previous job to ensure consistency and avoid re-running GitVersion logic
          # unless absolutely necessary for specific GitVersion calculations within this job.
          # For most cases, needs.build-and-test.outputs.sem_ver is sufficient.
          # We run it here primarily for preReleaseTag check for NuGet publish and precise tag info.
          current-branch: ${{ github.ref }} # Pass branch for accurate GitVersion calculation

      - name: Set REPO_OWNER_LOWER env var
        id: set_repo_owner_lower
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download NuGet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: ./artifacts/packages

      - name: Push NuGet & Symbols for Zentient.Endpoints
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          (github.ref_type == 'tag' && steps.gitversion_publish.outputs.preReleaseTag == '') # Use gitversion_publish here
        run: |
          for file in artifacts/packages/Zentient.Endpoints.*.{nupkg,snupkg}; do
            echo "Pushing $file to NuGet.org..."
            dotnet nuget push "$file" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate;
          done

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          github.ref_type == 'tag'
        with:
          context: .
          file: ./Dockerfile.runtime # Use the new runtime Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/zentient-endpoints:${{ steps.gitversion_publish.outputs.semVer }} # Use gitversion_publish here
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/zentient-endpoints:latest', env.REPO_OWNER_LOWER) || '' }}
          build-args: |
            TARGET_FRAMEWORK=net9.0 # Explicitly build for net9.0 for the final image

      - name: Extract Release Notes
        if: github.ref_type == 'tag'
        run: |
          # Ensure majorMinorPatch is accurate from gitversion_publish
          awk "/## \\[${{ steps.gitversion_publish.outputs.majorMinorPatch }}\\]/,/^## / {print}" src/Zentient.Endpoints/CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "::warning::Could not find release notes for version ${{ steps.gitversion_publish.outputs.majorMinorPatch }} in CHANGELOG.md. Release body will be empty."
            echo "No release notes found." > release-notes.md
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: actions/create-release@v1
        id: create_release # Added ID to reference its output
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Zentient.Endpoints ${{ steps.gitversion_publish.outputs.semVer }}"
          body_path: ./release-notes.md
          draft: false
          prerelease: false

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            artifacts/packages/Zentient.Endpoints.*.nupkg
            artifacts/packages/Zentient.Endpoints.*.snupkg
          asset_name: |
            Zentient.Endpoints.${{ needs.build-and-test.outputs.nuget_version_v2 }}.nupkg
            Zentient.Endpoints.${{ needs.build-and-test.outputs.nuget_version_v2 }}.snupkg
          asset_content_type: application/octet-stream
