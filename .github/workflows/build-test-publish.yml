# Build, Test & Publish Workflow for Zentient.Endpoints
# Path: .github/workflows/build-test-publish.yml
name: CI/CD - Build, Test & Publish (Zentient.Endpoints)

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head_sha: ${{ github.sha }}
      head_branch: ${{ github.ref_name }}
      sem_ver: ${{ steps.gitversion.outputs.semVer }} 
      nuget_version_v2: ${{ steps.gitversion.outputs.nuGetVersionV2 }} 

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x 
            9.0.x 

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Restore
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build
        run: dotnet build Zentient.Endpoints.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Zentient.Endpoints.sln --configuration Release --no-build --logger trx

      - name: Pack NuGet Packages
        run: |
          mkdir -p artifacts/packages
          dotnet pack src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/packages \
            /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }} \
            --no-build

          # For future:
          # find src -name "*.csproj" -print0 | while IFS= read -r -d $'\0' project_file; do
          #   if grep -q '<IsPackable>true</IsPackable>' "$project_file"; then
          #     dotnet pack "$project_file" --configuration Release --output artifacts/packages --no-build \
          #       /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }};
          #   fi
          # done

      - name: Publish for .NET 8.0 Deployment
        run: |
          mkdir -p artifacts/app/net8.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net8.0 \
            --framework net8.0 \
            /p:UseAppHost=false \
            --no-build 

      - name: Publish for .NET 9.0 Deployment
        run: |
          mkdir -p artifacts/app/net9.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net9.0 \
            --framework net9.0 \
            /p:UseAppHost=false \
            --no-build

      - name: Upload NuGet Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages

      - name: Upload .NET 8.0 App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net8.0-${{ github.sha }}
          path: artifacts/app/net8.0

      - name: Upload .NET 9.0 App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net9.0-${{ github.sha }}
          path: artifacts/app/net9.0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
          include-architecture: false§
          include-prerelease: false

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Restore
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build
        run: dotnet build Zentient.Endpoints.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Zentient.Endpoints.sln --configuration Release --no-build --logger trx

      - name: Pack
        run: |
          mkdir -p artifacts/packages
          # Use 'find' to locate only the Zentient.Endpoints.csproj for now,
          # as per your requirement to push only this package initially.
          # Future: modify this to dotnet pack src/**/*.csproj as needed.
          find src -name "Zentient.Endpoints.csproj" -print0 | xargs -0 -I {} dotnet pack "{}" \
            --configuration Release \
            --output artifacts/packages \
            /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages

  detect-changes:
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      modified_projects: ${{ steps.get_modified.outputs.modified_projects_for_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-test.outputs.head_sha }}
          fetch-depth: 0

      - name: Get Modified Packable Projects
        id: get_modified
        run: |
          BRANCH="${{ needs.build-and-test.outputs.head_branch }}"
          BASE_REF="origin/main"
          git fetch origin main

          MODIFIED_PACKABLE_PROJECTS=""

          if [[ "$BRANCH" == release/v* ]]; then
            echo "Stable release: checking diff against main"
            ALL_PROJECTS=$(find src/ -name "*.csproj" ! -path "src/Zentient.Endpoints.Tests.Shared/*" -exec grep -l '<IsPackable>true</IsPackable>' {} + || true)
            for PROJECT in $ALL_PROJECTS; do
              if git diff --name-only "$BASE_REF" HEAD -- "$PROJECT" "${PROJECT%/*}/" | grep -q .; then
                MODIFIED_PACKABLE_PROJECTS+="${PROJECT}"$'\n'
              fi
            done
          elif [[ "$BRANCH" == release/* ]]; then
            PACKAGE=$(echo "$BRANCH" | sed 's|release/||')
            if [[ "$PACKAGE" == "Endpoints" ]]; then
              TARGET="src/Zentient.Endpoints/Zentient.Endpoints.csproj"
            else
              TARGET="src/Zentient.Endpoints.${PACKAGE}/Zentient.Endpoints.${PACKAGE}.csproj"
            fi
            if git diff --name-only "$BASE_REF" HEAD -- "$TARGET" "${TARGET%/*}/" | grep -q .; then
              MODIFIED_PACKABLE_PROJECTS="${TARGET}"
            fi
          else
            echo "Unexpected release branch format: $BRANCH"
            exit 1
          fi

          echo "modified_projects_for_release<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MODIFIED_PACKABLE_PROJECTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  publish-packages:
    runs-on: ubuntu-latest
    needs: [build-and-test, detect-changes]
    if: |
      startsWith(needs.build-and-test.outputs.head_branch, 'release/') &&
      needs.detect-changes.outputs.modified_projects != ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-test.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.build-and-test.outputs.head_sha }}
          path: artifacts/packages

      - name: Push Modified NuGet Packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          echo "${{ needs.detect-changes.outputs.modified_projects }}" | while read -r PROJECT_PATH; do
            PACKAGE_NAME=$(basename "$PROJECT_PATH" .csproj)
            PACKAGE_FILE=$(find artifacts/packages -name "${PACKAGE_NAME}.*.nupkg" ! -name "*.symbols.nupkg" | head -n1)
            if [[ -f "$PACKAGE_FILE" ]]; then
              echo "Publishing $PACKAGE_FILE..."
              dotnet nuget push "$PACKAGE_FILE" \
                --source https://api.nuget.org/v3/index.json \
                --api-key "$NUGET_API_KEY" \
                --skip-duplicate
            else
              echo "No package found for $PACKAGE_NAME - skipping."
            fi
          done

      - name: Summarize Published Packages
        run: |
          echo "### Published NuGet Packages" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.detect-changes.outputs.modified_projects }}" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      success() &&
      (startsWith(github.ref, 'refs/heads/release/') || github.ref_type == 'tag')
    steps:
      - name: Download NuGet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: ./artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Read version from GitVersion
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Set REPO_OWNER_LOWER env var
        id: set_repo_owner_lower
        run: echo "REPO_OWNER_LOWER=$(echo '${GITHUB_REPOSITORY_OWNER}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Push NuGet & Symbols for Zentient.Endpoints
        run: |
          for file in artifacts/packages/Zentient.Endpoints.*.{nupkg,snupkg}; do
            dotnet nuget push "$file" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate;
          done
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          (github.ref_type == 'tag' && steps.gitversion.outputs.preReleaseTag == '')

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          github.ref_type == 'tag'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/zentient-endpoints:${{ steps.gitversion.outputs.semVer }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/zentient-endpoints:latest', env.REPO_OWNER_LOWER) || '' }}

      - name: Extract Release Notes
        if: github.ref_type == 'tag'
        run: |
          awk "/## \[${{ steps.gitversion.outputs.majorMinorPatch }}\]/,/^## /" src/Zentient.Endpoints/CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Zentient.Endpoints ${{ steps.gitversion.outputs.semVer }}"
          body_path: ./release-notes.md
          draft: false
          prerelease: false

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            artifacts/packages/Zentient.Endpoints.*.nupkg
            artifacts/packages/Zentient.Endpoints.*.snupkg
          asset_name: |
            ${{ steps.gitversion.outputs.majorMinorPatch }}.nupkg
            ${{ steps.gitversion.outputs.majorMinorPatch }}.snupkg
          asset_content_type: application/octet-stream
