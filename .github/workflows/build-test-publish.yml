# Build, Test & Publish Workflow for Zentient.Endpoints
# Path: .github/workflows/build-test-publish.yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop/*
      - release/*
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop/*
      - release/*
  workflow_dispatch:

env:
  # Common environment variables for all jobs
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      head_sha: ${{ github.sha }}
      head_branch: ${{ github.ref_name }}
      sem_ver: ${{ steps.gitversion.outputs.semVer }}
      nuget_version_v2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      major_minor_patch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      # Add individual GitVersion outputs
      gitversion_major: ${{ steps.gitversion.outputs.Major }}
      gitversion_minor: ${{ steps.gitversion.outputs.Minor }}
      gitversion_patch: ${{ steps.gitversion.outputs.Patch }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Restore NuGet Packages
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build Solution
        run: |
          dotnet build Zentient.Endpoints.sln \
            --configuration Release \
            --no-restore \
            /p:ZENTIENT_VERSION_FINAL=${{ steps.gitversion.outputs.semVer }} \
            /p:ZENTIENT_VERSION_MAJOR=${{ steps.gitversion.outputs.Major }} \
            /p:ZENTIENT_VERSION_MINOR=${{ steps.gitversion.outputs.Minor }} \
            /p:ZENTIENT_VERSION_PATCH=${{ steps.gitversion.outputs.Patch }}

      - name: Run Tests
        run: dotnet test Zentient.Endpoints.sln --configuration Release --no-build --logger trx

      - name: Pack NuGet Packages
        env:
          GITVERSION_NUGGET_VERSION_V2: ${{ steps.gitversion.outputs.NuGetVersionV2 }} 
        run: |
          mkdir -p artifacts/packages
          echo "DEBUG: Attempting to pack with version (from GITVERSION_NUGGET_VERSION_V2 env var): $GITVERSION_NUGGET_VERSION_V2"
          dotnet pack src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/packages \
            /p:Version="$GITVERSION_NUGGET_VERSION_V2" \ 
            --no-build

      - name: (Debug) List Packages After Packing
        run: |
          echo "Contents of artifacts/packages AFTER dotnet pack:"
          ls -lR artifacts/packages
          EXPECTED_NUPKG="artifacts/packages/Zentient.Endpoints.${{ steps.gitversion.outputs.NuGetVersionV2 }}.nupkg"
          echo "DEBUG: Looking for expected package: $EXPECTED_NUPKG"
          if [ -f "$EXPECTED_NUPKG" ]; then
            echo "SUCCESS: Expected package '$EXPECTED_NUPKG' found."
          else
            echo "ERROR: Expected package '$EXPECTED_NUPKG' NOT found."
            if [ -f "artifacts/packages/Zentient.Endpoints.0.1.0-local.nupkg" ]; then
                echo "WARNING: Found Zentient.Endpoints.0.1.0-local.nupkg instead."
            fi
            exit 1
          fi

          # For future revisions, to pack all non-test packages:
          # find src -name "*.csproj" -print0 | while IFS= read -r -d $'\0' project_file; do
          #   # Check if the project is packable (e.g., by looking for <IsPackable>true</IsPackable>)
          #   # You might need more sophisticated logic here based on your Directory.Build.targets
          #   if ! grep -q '<IsTestProject>true</IsTestProject>' "$project_file" && grep -q '<IsPackable>true</IsPackable>' "$project_file"; then
          #     echo "Packing $project_file..."
          #     dotnet pack "$project_file" --configuration Release --output artifacts/packages --no-build \
          #       /p:Version=${{ steps.gitversion.outputs.nuget_version_v2 }};
          #   fi
          # done

      - name: Publish .NET 8.0 Application Output
        run: |
          mkdir -p artifacts/app/net8.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net8.0 \
            --framework net8.0 \
            /p:UseAppHost=false \
            /p:ZENTIENT_VERSION_FINAL=${{ steps.gitversion.outputs.semVer }} \
            --no-build

      - name: Publish .NET 9.0 Application Output
        run: |
          mkdir -p artifacts/app/net9.0
          dotnet publish src/Zentient.Endpoints/Zentient.Endpoints.csproj \
            --configuration Release \
            --output artifacts/app/net9.0 \
            --framework net9.0 \
            /p:UseAppHost=false \
            /p:ZENTIENT_VERSION_FINAL=${{ steps.gitversion.outputs.semVer }} \
            --no-build

      - name: Upload NuGet Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages

      - name: Upload .NET 8.0 App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net8.0-${{ github.sha }}
          path: artifacts/app/net8.0

      - name: Upload .NET 9.0 App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentient-endpoints-net9.0-${{ github.sha }}
          path: artifacts/app/net9.0

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: |
      success() &&
      (startsWith(github.ref, 'refs/heads/release/') || github.ref_type == 'tag')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository (for release notes, if applicable)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup .NET SDK (for dotnet nuget push)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install GitVersion (for final version consistency)
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version (for final version consistency)
        id: gitversion_release
        uses: GitTools/actions/gitversion/execute@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set REPO_OWNER_LOWER env var
        id: set_repo_owner_lower
        run: echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.build-and-test.outputs.head_sha }}
          path: artifacts/packages

      - name: Debug NuGet Package Info
        run: |
          echo "Debug Info for NuGet Push:"
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_type: ${{ github.ref_type }}"
          echo "GitVersion nuget_version_v2: ${{ needs.build-and-test.outputs.nuget_version_v2 }}"
          echo "Contents of artifacts/packages:"
          ls -R artifacts/packages || true
          echo "Attempting to find package using direct path and wildcard:"
          find artifacts/packages -name "Zentient.Endpoints.${{ needs.build-and-test.outputs.nuget_version_v2 }}.nupkg" -print || true
          find artifacts/packages -name "Zentient.Endpoints.*.nupkg" -print || true

      - name: Push Zentient.Endpoints NuGet Package to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: |
          success() && (
            startsWith(github.ref, 'refs/heads/release/') ||
            github.ref_type == 'tag'
          )
        run: |
          PACKAGE_FILE=$(find artifacts/packages -name "Zentient.Endpoints.*.nupkg" ! -name "*.symbols.nupkg" | head -n1)
          SYMBOL_PACKAGE_FILE=$(find artifacts/packages -name "Zentient.Endpoints.*.snupkg" | head -n1)

          if [[ -f "$PACKAGE_FILE" ]]; then
            echo "Publishing primary package: $PACKAGE_FILE..."
            dotnet nuget push "$PACKAGE_FILE" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          else
            echo "Primary NuGet package not found. Expected: Zentient.Endpoints.${{ needs.build-and-test.outputs.nuget_version_v2 }}.nupkg. Skipping push."
            exit 1
          fi

          if [[ -f "$SYMBOL_PACKAGE_FILE" ]]; then
            echo "Publishing symbols package: $SYMBOL_PACKAGE_FILE..."
            dotnet nuget push "$SYMBOL_PACKAGE_FILE" \
              --source https://api.nuget.org/v3/index.json/symbolpackage \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          else
            echo "Symbols NuGet package not found. Expected: Zentient.Endpoints.${{ needs.build-and-test.outputs.nuget_version_v2 }}.snupkg. Skipping push."
          fi

      - name: Download .NET 8.0 App Artifact
        uses: actions/download-artifact@v4
        with:
          name: zentient-endpoints-net8.0-${{ needs.build-and-test.outputs.head_sha }}
          path: /tmp/app_net80

      - name: Build & Push Docker Image (net8.0)
        uses: docker/build-push-action@v5
        with:
          context: /tmp/app_net80
          file: Dockerfile.runtime
          push: true
          build-args: TARGET_FRAMEWORK=8.0
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/zentient-endpoints:net8.0-${{ needs.build-and-test.outputs.sem_ver }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/zentient-endpoints:net8.0-latest', env.REPO_OWNER_LOWER) || '' }}
        env:
          DOCKER_BUILDKIT: 1

      - name: Download .NET 9.0 App Artifact
        uses: actions/download-artifact@v4
        with:
            name: zentient-endpoints-net9.0-${{ needs.build-and-test.outputs.head_sha }}
            path: /tmp/app_net90

      - name: Build & Push Docker Image (net9.0)
        uses: docker/build-push-action@v5
        with:
          context: /tmp/app_net90
          file: Dockerfile.runtime
          push: true
          build-args: TARGET_FRAMEWORK=9.0
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/zentient-endpoints:net9.0-${{ needs.build-and-test.outputs.sem_ver }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/zentient-endpoints:net9.0-latest', env.REPO_OWNER_LOWER) || '' }}
        env:
          DOCKER_BUILDKIT: 1

      # GitHub Release steps:
      # Now, these steps will run for both 'release/*' branches AND tags.
      # Be aware: creating a GitHub Release from a branch means the release
      # is tied to the current state of that branch at the time of the push.
      # Subsequent pushes to the same branch will create NEW releases or require manual management.
      - name: Extract Release Notes
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          github.ref_type == 'tag'
        run: |
          awk "/^## \\[${{ needs.build-and-test.outputs.major_minor_patch }}\\]/,/^## /" src/Zentient.Endpoints/CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        id: create_release
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          github.ref_type == 'tag'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Zentient.Endpoints ${{ needs.build-and-test.outputs.sem_ver }}"
          body_path: ./release-notes.md
          draft: false
          prerelease: ${{ needs.build-and-test.outputs.sem_ver != needs.build-and-test.outputs.major_minor_patch }}

      - name: Upload Release Assets (NuGet Packages to GitHub Release)
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          github.ref_type == 'tag'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/packages/Zentient.Endpoints.${{ needs.build-and-test.outputs.nuget_version_v2 }}.nupkg
          asset_name: Zentient.Endpoints-${{ needs.build-and-test.outputs.nuget_version_v2 }}.nupkg
          asset_content_type: application/octet-stream

      - name: Upload Release Symbols Asset
        if: |
          startsWith(github.ref, 'refs/heads/release/') ||
          github.ref_type == 'tag'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/packages/Zentient.Endpoints.${{ needs.build-and-test.outputs.nuget_version_v2 }}.snupkg
          asset_name: Zentient.Endpoints-${{ needs.build-and-test.outputs.nuget_version_v2 }}.snupkg
          asset_content_type: application/octet-stream
