# Release Workflow for ulfbou/Zentient.Endpoints
# Path: .github/workflows/build-and-test.yml
name: CI - Zentient.Endpoints (Full Solution Build & Test)

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ github.sha }}
      
    concurrency:
      group: ${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version (for build outputs, not final NuGet push)
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v0.10.2

      - name: Restore dependencies
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build Solution (Release)
        run: dotnet build Zentient.Endpoints.sln -c Release /p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }}

      - name: Run All Tests
        run: |
          TEST_PROJECTS=$(find tests/ -name "*.csproj" -print)
          echo "Running tests for: $TEST_PROJECTS"
          dotnet test $TEST_PROJECTS --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage" --results-directory "${{ runner.temp }}/test-results"
        shell: bash
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: ${{ runner.temp }}/test-results

      - name: Find All Packable Projects
        id: find_packable_projects
        run: |
          PACKABLE_PROJECTS=$(find src/ -name "*.csproj" ! -path "src/Zentient.Endpoints.Tests.Shared/*" -exec grep -l -E '<IsPackable>true</IsPackable>' {} + || true)
          echo "packable_project_paths=$PACKABLE_PROJECTS" >> $GITHUB_OUTPUT
        shell: bash

      - name: Pack All Packable Projects (for artifacts)
        if: steps.find_packable_projects.outputs.packable_project_paths != ''
        run: |
          # Use GitVersion's output for consistency, but this is an internal build version for the artifacts
          # The actual NuGet push will use a re-evaluated version in the release pipeline
          VERSION_FOR_ARTIFACTS=${{ steps.gitversion.outputs.NuGetVersionV2 }}
          for PROJECT_PATH in ${{ steps.find_packable_projects.outputs.packable_project_paths }}; do
            echo "Packing artifact: $PROJECT_PATH"
            dotnet pack "$PROJECT_PATH" -c Release /p:Version=$VERSION_FOR_ARTIFACTS --no-build -o artifacts/packages
          done
        shell: bash

      - name: Upload NuGet Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages/**/*.nupkg
          if-no-files-found: ignore
