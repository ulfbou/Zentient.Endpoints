# .github/workflows/ci.yml
name: CI & Release - Zentient.Endpoints

on:
  push:
    branches:
      - 'release/**' 
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- DEBUGGING / INFO STEPS (Optional, good for initial setup) ---
      - name: (Debug) workspace state
        run: |
          echo "Current working directory: $(pwd)"
          echo "Listing contents of current directory:"
          ls -R .
          if [ -f Zentient.Endpoints.sln ]; then
            echo "Contents of Zentient.Endpoints.sln:"
            cat Zentient.Endpoints.sln
          else
            echo "ERROR: Zentient.Endpoints.sln not found!" >&2
            exit 1
          fi
        shell: bash
      # --- END DEBUGGING / INFO STEPS ---

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v0.10.2

      - name: Restore dependencies
        run: dotnet restore Zentient.Endpoints.sln

      - name: Build (Release)
        run: dotnet build Zentient.Endpoints.sln -c Release /p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }}

      - name: Run Tests
        run: |
          TEST_PROJECTS=$(find tests/ -name "*.csproj" -print)
          echo "Running tests for: $TEST_PROJECTS"
          dotnet test $TEST_PROJECTS --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage" --results-directory "${{ runner.temp }}/test-results"
        shell: bash
      
      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results

      # --- Conditional Packaging and Publishing ---
      # Identify modified projects for packing
      - name: Get modified packable projects
        id: get_modified_projects
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_REF="${{ github.event.before }}"
            if [ "$BASE_REF" == "0000000000000000000000000000000000000000" ]; then
              echo "First commit on branch, comparing to main for diff."
              git fetch origin main
              BASE_REF="origin/main"
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi

          echo "Comparing against base ref: $BASE_REF"
          
          ALL_PACKABLE_PROJECTS=$(find src/ -name "*.csproj" ! -path "src/Zentient.Endpoints.Tests.Shared/*" -print)
          
          echo "All packable projects found: $ALL_PACKABLE_PROJECTS"

          MODIFIED_PROJECTS=""
          for PROJECT_PATH in $ALL_PACKABLE_PROJECTS; do
            if git diff --name-only "$BASE_REF" HEAD -- "$PROJECT_PATH" "${PROJECT_PATH%/*}/" | grep -q .; then
              MODIFIED_PROJECTS="$MODIFIED_PROJECTS $PROJECT_PATH"
              echo "Detected changes in $PROJECT_PATH"
            else
              echo "No changes detected in $PROJECT_PATH"
            fi
          done

          echo "modified_projects=$MODIFIED_PROJECTS" >> $GITHUB_OUTPUT
        shell: bash

      - name: Pack and Publish Modified Projects
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && steps.get_modified_projects.outputs.modified_projects != ''
        run: |
          for PROJECT_PATH in ${{ steps.get_modified_projects.outputs.modified_projects }}; do
            echo "Packing project: $PROJECT_PATH"
            dotnet pack "$PROJECT_PATH" -c Release /p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }} --no-build
          done
          
          echo "Publishing NuGet packages..."
          find artifacts/packages -name "*.nupkg" -print0 | while IFS= read -r -d $'\0' NUPKG_PATH; do
            echo "Pushing $NUPKG_PATH"
            dotnet nuget push "$NUPKG_PATH" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
          done
        shell: bash

  docker_build:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags) for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zentient-endpoints-ci-dotnet
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile 
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
