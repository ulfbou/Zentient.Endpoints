name: CD - Publish Packages (Zentient.Endpoints)

on:
  workflow_run:
    workflows: ["CI - Full Solution Build & Test (Zentient.Endpoints)"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'release/') &&
      github.repository_owner == 'ulfbou'

    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version for Release
        id: gitversion_release
        uses: GitTools/actions/gitversion/execute@v1

      - name: Download NuGet Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ github.event.workflow_run.head_sha }}
          path: artifacts/packages

      - name: Get Modified Packable Projects for Release
        id: get_modified_for_release
        run: |
          BRANCH_PATH="${{ github.event.workflow_run.head_branch }}"
          MODIFIED_PACKABLE_PROJECTS=""

          git fetch origin main
          BASE_REF="origin/main"

          if [[ "$BRANCH_PATH" == release/v* ]]; then
            echo "Stable release: Comparing against main."
            ALL_PACKABLE_PROJECTS=$(find src/ -name "*.csproj" ! -path "src/Zentient.Endpoints.Tests.Shared/*" -exec grep -l -E '<IsPackable>true</IsPackable>' {} + || true)
            for PROJECT_PATH in $ALL_PACKABLE_PROJECTS; do
              if git diff --name-only "$BASE_REF" "${{ github.event.workflow_run.head_sha }}" -- "$PROJECT_PATH" "${PROJECT_PATH%/*}/" | grep -q .; then
                MODIFIED_PACKABLE_PROJECTS+="${PROJECT_PATH}"$'\n'
                echo "Detected changes in $PROJECT_PATH"
              fi
            done

          elif [[ "$BRANCH_PATH" == release/* ]]; then
            echo "Pre-release: Targeting single package."
            PACKAGE_NAME=$(echo "$BRANCH_PATH" | sed 's|release/||')
            if [[ "$PACKAGE_NAME" == "Endpoints" ]]; then
              TARGET_PROJECT="src/Zentient.Endpoints/Zentient.Endpoints.csproj"
            else
              TARGET_PROJECT="src/Zentient.Endpoints.${PACKAGE_NAME}/Zentient.Endpoints.${PACKAGE_NAME}.csproj"
            fi

            if git diff --name-only "$BASE_REF" "${{ github.event.workflow_run.head_sha }}" -- "$TARGET_PROJECT" "${TARGET_PROJECT%/*}/" | grep -q .; then
              MODIFIED_PACKABLE_PROJECTS="$TARGET_PROJECT"
              echo "Detected changes in $TARGET_PROJECT"
            else
              echo "No changes in $TARGET_PROJECT. Skipping."
            fi

          else
            echo "Unhandled branch pattern: $BRANCH_PATH"
            exit 1
          fi

          echo "modified_projects_for_release<<EOF" >> $GITHUB_OUTPUT
          echo "$MODIFIED_PACKABLE_PROJECTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Push Modified NuGet Packages to NuGet.org
        if: steps.get_modified_for_release.outputs.modified_projects_for_release != ''
        run: |
          MODIFIED_PROJECTS="${{ steps.get_modified_for_release.outputs.modified_projects_for_release }}"
          RELEASE_VERSION="${{ steps.gitversion_release.outputs.NuGetVersionV2 }}"
          NUGET_API_KEY=${{ secrets.NUGET_API_KEY }}

          echo "$MODIFIED_PROJECTS" | while read -r PROJECT_PATH; do
            [ -z "$PROJECT_PATH" ] && continue
            PROJECT_NAME=$(basename "$PROJECT_PATH" .csproj)
            PACKAGE_NAME=${PROJECT_NAME}
            NUPKG_FILE=$(find artifacts/packages -name "${PACKAGE_NAME}.${RELEASE_VERSION}*.nupkg" -print -quit)

            if [ -n "$NUPKG_FILE" ]; then
              echo "Pushing $NUPKG_FILE..."
              dotnet nuget push "$NUPKG_FILE" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
            else
              echo "Package for $PROJECT_NAME not found. Skipping."
            fi
          done
        shell: bash

      - name: Summarize Published Packages
        if: steps.get_modified_for_release.outputs.modified_projects_for_release != ''
        run: |
          echo "### Published NuGet Packages" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.get_modified_for_release.outputs.modified_projects_for_release }}" | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
