# Release Workflow for ulfbou/Zentient.Endpoints
# Path: .github/workflows/build-and-test.yml
name: CI - Full Solution Build & Test (Zentient.Endpoints)

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ github.sha }}

    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.ref }}-build
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion (host)
        uses: GitTools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Determine Semantic Version (host)
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v1

      - name: Set lowercase repository name
        run: echo "REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image with GitVersion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/zentient-endpoints:${{ steps.gitversion.outputs.semVer }}
            ghcr.io/${{ env.REPO_LOWER }}/zentient-endpoints:latest
          build-args: |
            ZENTIENT_VERSION_FINAL_OVERRIDE=${{ steps.gitversion.outputs.semVer }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create directory for extracted artifacts
        run: |
          mkdir -p artifacts/packages
          mkdir -p test-results

      - name: Extract NuGet packages from container
        run: |
          CONTAINER_ID=$(docker create ghcr.io/${{ env.REPO_LOWER }}/zentient-endpoints:${{ steps.gitversion.outputs.semVer }})
          docker cp "$CONTAINER_ID:/app/nuget-packages/." ./artifacts/packages/
          docker rm "$CONTAINER_ID"
        shell: bash

      - name: Extract Test Results from container
        run: |
          CONTAINER_ID=$(docker create ghcr.io/${{ env.REPO_LOWER }}/zentient-endpoints:${{ steps.gitversion.outputs.semVer }})
          docker cp "$CONTAINER_ID:/app/test-results/." ./test-results/
          docker rm "$CONTAINER_ID"
        shell: bash

      - name: Show Extracted NuGet Packages
        run: ls -lh artifacts/packages
        shell: bash

      - name: Show Extracted Test Results
        run: ls -lh test-results
        shell: bash

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: test-results/

      - name: Upload NuGet Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/packages/**/*.nupkg
          if-no-files-found: ignore
