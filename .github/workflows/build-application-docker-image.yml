# .github/workflows/build-application-docker-image.yml
name: CD - Zentient.Endpoints (Build Application Docker Image)

on:
  push:
    branches:
      - 'release/v*.*.*'
      - 'release/*'
  pull_request: 
    branches:
      - main

jobs:
  docker_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs: 
      image_tag: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Semantic Version (for image tags)
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v0.10.2

      - name: Extract metadata (tags) for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zentient-endpoints
          tags: |
            type=raw,value=${{ steps.gitversion.outputs.NuGetVersionV2 }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }} 
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
